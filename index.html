<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="An interactive WebGL transition between two photographs, built with Three.js and GSAP."
		/>
		<meta name="theme-color" content="#242424" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://s3-us-west-2.amazonaws.com; img-src 'self' data:; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
		/>
		<title>Three Image Transition</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main id="three-container" aria-label="Animated image transition"></main>

		<div id="instructions" role="status">
			Drag horizontally to scrub the transition. Press P to pause or resume.
		</div>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r75/three.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.18.0/TweenMax.min.js"></script>
		<script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/175711/bas.js"></script>
		<script src="script.js"></script>
	</body>
</html>
